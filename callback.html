<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Volvo login callback</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #111; background: #fff; }
  textarea { width: 100%; height: 120px; font: 13px ui-monospace, monospace; }
  button { font-size: 16px; padding: 8px 16px; margin-top: 8px; }
  .err { color: #b00020; }
</style>
</head>
<body>
<h1>Volvo login callback</h1>
<div id="out"></div>
<script>
  // Nothing is sent anywhere: the page only shows the redirect URL so it can be pasted into the local script.
  const p = new URLSearchParams(location.search);
  const out = document.getElementById('out');
  if (p.get('error')) {
    out.innerHTML = '<p class="err">Login failed: <b></b></p>';
    out.querySelector('b').textContent = p.get('error') + ' ' + (p.get('error_description') || '');
  } else if (p.get('code')) {
    out.innerHTML = '<p>Login succeeded. Copy the full URL below and paste it into the terminal running <code>volvo_auth.py login</code>. The code expires within minutes.</p><textarea id="u" readonly></textarea><br><button id="c">Copy</button>';
    const u = document.getElementById('u');
    u.value = location.href;
    document.getElementById('c').onclick = () => { u.select(); navigator.clipboard.writeText(u.value); };
  } else {
    out.innerHTML = '<p>This page receives the OAuth2 redirect for a private Volvo telemetry application. There is nothing to do here.</p>';
  }
</script>
</body>
</html>
